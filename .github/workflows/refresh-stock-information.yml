name: Refresh stock information from 2025

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write
  actions: write

concurrency:
  group: stock-information-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install original chart adapter dependency
        run: python -m pip install -r scripts/requirements-chart-history.txt
      - name: Test data collection
        run: python -m unittest discover -s tests
      - name: Refresh latest prices, metrics and reported financials
        run: python scripts/stock_information.py collect
      - name: Recover omitted 2025 statements
        run: python scripts/backfill_stock_information_2025.py
      - name: Refresh continuous daily histories
        run: python scripts/refresh_stock_information_history.py
      - name: Refresh current scanner quotes after collection
        run: python scripts/stock_information.py refresh-quotes
      - name: Save snapshots and progress
        run: |
          python scripts/stock_information.py fill-daily-quotes
          python scripts/stock_information.py checkpoint
          python scripts/stock_information.py export
      - name: Commit data and trigger site build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock-information data/stock-history data/information-audit
          if ! git diff --cached --quiet; then
            git commit -m "Refresh stock information and prices from 2025"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" = "3" ]; then exit 1; fi
              git fetch origin main
              git rebase origin/main
            done
          fi
      - name: Dispatch site build for the committed snapshots
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-site.yml',
              ref: 'main',
              inputs: { force_fetch: 'true' },
            });
