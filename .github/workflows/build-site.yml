name: Build Stock Peer Site

on:
  workflow_dispatch:
    inputs:
      force_fetch:
        description: "Fetch fresh quote data before building."
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test data pipeline and external scheduler
        # Fail before collecting or pushing source data when collector or
        # scheduler code does not satisfy its local safety contracts.
        run: |
          python -m unittest discover -s tests
          node --test automation/refresh-scheduler/test/*.test.mjs

      - name: Collect daily new highs after each market close
        # Completed session files are reused. Failed markets retry after 30 minutes.
        # A provider failure must not stop the independent peer quote deployment.
        continue-on-error: true
        run: python scripts/refresh_new_highs.py

      - name: Validate collected daily archive
        # Validate every source report and refresh state before any source push.
        # Keep validation output outside the checkout so a concurrent push can
        # still be rebased without unstaged generated files blocking Git.
        run: >-
          python scripts/generate_new_high_data.py
          --output-dir "$RUNNER_TEMP/new-high-validation"
          --no-copy-to-frontend

      - name: Save daily archive before building
        # Persist successes/retry state even when quote collection or a later build fails.
        # Do not publish an archive whose durable source could not be saved.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/new-highs
          if ! git diff --cached --quiet; then
            git commit -m "Save daily new-high archive [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" = "3" ]; then exit 1; fi
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Generate stock data
        id: quotes
        # The generator preserves all files on total quote-source failure.
        # Daily new highs can still be published with the previous price snapshot.
        continue-on-error: true
        env:
          FETCH_QUOTES: ${{ github.event_name != 'workflow_dispatch' || inputs.force_fetch }}
        run: |
          if [ "$FETCH_QUOTES" = "true" ]; then
            python scripts/generate_static_data.py
          else
            python scripts/generate_static_data.py --no-fetch
          fi

      - name: Report retained prices
        if: steps.quotes.outcome == 'failure'
        run: |
          echo "::warning::Quote collection failed. Retaining the previous prices and their timestamps while updating the daily archive."
          test -f frontend/public/data/index.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Copy SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Commit generated stock data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # A concurrent source push must not block publishing an otherwise valid build.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated frontend/public/data data/new-highs
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            update_timestamp="$(TZ=Asia/Seoul date +'%y%m%d_%H%M%S')"
            git commit -m "Update stock peer data ${update_timestamp} [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
