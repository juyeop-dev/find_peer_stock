name: Build Stock Peer Site

on:
  workflow_dispatch:
    inputs:
      force_fetch:
        description: "Fetch fresh quote data before building."
        required: false
        default: true
        type: boolean
      publish_pages:
        description: "Publish the Pages UI as well as refreshing static data."
        default: false
        type: boolean
      rehearse_static:
        description: "Verify the static Pages build without publishing."
        default: false
        type: boolean
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' && !inputs.rehearse_static }}
    # A Pages deployment can wait indefinitely. Keep archive collection independent.
    concurrency:
      group: market-archive-${{ github.ref }}
      # Release pushes replace stale builds; scheduled collectors keep queuing.
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ vars.STATIC_DATA_PAGES_ENABLED == 'true' && 60 || 45 }}
    outputs:
      pages_uploaded: ${{ steps.pages_upload.outcome == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test data pipeline and external scheduler
        # Fail before collecting or pushing source data when collector or
        # scheduler code does not satisfy its local safety contracts.
        run: |
          python -m unittest discover -s tests
          node --test automation/refresh-scheduler/test/*.test.mjs
          node --test automation/live-api/test/*.test.mjs

      - name: Collect daily new highs after each market close
        # Completed session files are reused. Failed markets retry after 30 minutes.
        # A provider failure must not stop the independent peer quote deployment.
        continue-on-error: true
        run: python scripts/refresh_new_highs.py

      - name: Collect daily turnover rankings after each market close
        continue-on-error: true
        run: python scripts/refresh_turnover.py

      - name: Collect Korean daily low-to-close rebounds after the close
        continue-on-error: true
        run: python scripts/rebound_data.py collect

      - name: Validate collected daily archive
        # Validate every source report and refresh state before any source push.
        # Keep validation output outside the checkout so a concurrent push can
        # still be rebased without unstaged generated files blocking Git.
        run: >-
          python scripts/generate_new_high_data.py
          --output-dir "$RUNNER_TEMP/new-high-validation"
          --no-copy-to-frontend

      - name: Validate collected turnover archive
        run: >-
          python scripts/generate_turnover_data.py
          --output-dir "$RUNNER_TEMP/turnover-validation"
          --no-copy-to-frontend

      - name: Validate collected rebound archive
        run: python scripts/rebound_data.py publish --output-dir "$RUNNER_TEMP/rebound-validation"

      - name: Save daily archive before building
        # Persist successes/retry state even when quote collection or a later build fails.
        # Do not publish an archive whose durable source could not be saved.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/new-highs data/turnover data/rebounds
          if ! git diff --cached --quiet; then
            git commit -m "Save daily market archives [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" = "3" ]; then exit 1; fi
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Refresh Korean semiconductor history and financials
        run: python scripts/generate_semiconductor_data.py full

      - name: Refresh Korean margin loan balances
        continue-on-error: true
        run: python scripts/generate_credit_data.py

      - name: Refresh domestic sector rankings
        continue-on-error: true
        run: node scripts/refresh_sectors.mjs

      - name: Refresh daily investor flows and matching indices
        continue-on-error: true
        run: node scripts/refresh_investors.mjs

      - name: Save semiconductor daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/semiconductor/index.json data/semiconductor/preserved-snapshots data/credit/index.json frontend/public/data/credit/index.json data/sectors data/investors
          if ! git diff --cached --quiet; then
            git commit -m "Refresh semiconductor daily history [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" = "3" ]; then exit 1; fi
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Generate stock data
        id: quotes
        # The generator preserves all files on total quote-source failure.
        # Daily archives can still be published with the previous price snapshot.
        continue-on-error: true
        env:
          FETCH_QUOTES: ${{ github.event_name != 'workflow_dispatch' || inputs.force_fetch }}
        run: |
          if [ "$FETCH_QUOTES" = "true" ]; then
            python scripts/generate_static_data.py
          else
            python scripts/generate_static_data.py --no-fetch
          fi

      - name: Report retained prices
        if: steps.quotes.outcome == 'failure'
        run: |
          echo "::warning::Quote collection failed. Retaining the previous prices and their timestamps while updating the daily archive."
          test -f frontend/public/data/index.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test packed static data and retention
        working-directory: frontend
        run: npm run test:static-data

      - name: Test semiconductor return calculations
        working-directory: frontend
        run: npm run test:semiconductor

      - name: Test calendar history calculations
        working-directory: frontend
        run: npm run test:calendar-history

      - name: Test calendar stock detail navigation
        working-directory: frontend
        run: npm run test:stock-details

      - name: Test chart replay and hidden-future aggregation
        working-directory: frontend
        run: npm run test:chart-replay

      - name: Test one-year chart coverage
        working-directory: frontend
        run: npm run test:stock-history

      - name: Test reported financial information retention
        working-directory: frontend
        run: npm run test:stock-information

      - name: Test domestic sector aggregation
        working-directory: frontend
        run: |
          npm run test:sectors
          npm run test:sector-explorer
          npm run test:investor-flows

      - name: Test daily rebound readers
        working-directory: frontend
        run: npm run test:rebounds

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Copy SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Test Korean IME search in Chromium
        working-directory: frontend
        env:
          BROWSER_PATH: /usr/bin/google-chrome
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          STOCK_SITE_BASE_URL: http://127.0.0.1:4174/${{ github.event.repository.name }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > "$RUNNER_TEMP/ime-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail "$STOCK_SITE_BASE_URL/" > /dev/null; then break; fi
            sleep 1
          done
          npm run test:korean-search:browser

      - name: Verify published 2014 and retained 2015/2016/2017 histories
        run: |
          python scripts/audit_publication_2014.py --artifact frontend/dist
          python scripts/audit_publication_2015.py --artifact frontend/dist
          python scripts/audit_publication_2016.py --artifact frontend/dist
          python scripts/audit_publication_2017.py --artifact frontend/dist

      - name: Prepare separate static publication
        id: packed
        if: ${{ vars.STATIC_DATA_PAGES_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.STATIC_CLOUDFLARE_ACCOUNT_ID }}
          DATA_BASE: ${{ vars.STATIC_DATA_BASE_URL }}
          PUBLISH_PAGES: ${{ github.event_name == 'push' || inputs.publish_pages == true }}
          STATIC_PAGES_COMPAT_URL: ${{ vars.STATIC_PAGES_COMPAT_URL }}
          STATIC_PAGES_COMPAT_SHA256: ${{ vars.STATIC_PAGES_COMPAT_SHA256 }}
          STATIC_PAGES_COMPAT_INVENTORY_SHA256: ${{ vars.STATIC_PAGES_COMPAT_INVENTORY_SHA256 }}
        run: |
          args=(--source frontend/dist/data --output "$RUNNER_TEMP/static-publication" --data-base-url "$DATA_BASE")
          if [ "$PUBLISH_PAGES" = true ]; then args+=(--pages); fi
          python scripts/prepare_static_ci.py "${args[@]}"

      - name: Publish changed data before Pages
        if: ${{ vars.STATIC_DATA_PAGES_ENABLED == 'true' && steps.packed.outputs.changed == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.STATIC_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STATIC_API_TOKEN }}
          STATIC_CONFIG: ${{ steps.packed.outputs.config }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_STATIC_API_TOKEN is required for static data publishing.'
            exit 1
          fi
          npx --yes wrangler@4.151.2 deploy --config "$STATIC_CONFIG"

      - name: Verify live data before Pages
        if: ${{ vars.STATIC_DATA_PAGES_ENABLED == 'true' }}
        env:
          DATA_BASE: ${{ vars.STATIC_DATA_BASE_URL }}
          STATIC_REVISION: ${{ steps.packed.outputs.revision }}
        run: node scripts/verify-static-host.mjs "$DATA_BASE" "$STATIC_REVISION" index.json credit/index.json investors/index.json semiconductor/index.json

      - name: Upload Pages artifact
        id: pages_upload
        if: ${{ vars.STATIC_DATA_PAGES_ENABLED != 'true' || steps.packed.outputs.pages != '' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.packed.outputs.pages || 'frontend/dist' }}

  deploy:
    if: ${{ needs.build.outputs.pages_uploaded == 'true' }}
    # Replace a stuck Pages deployment without blocking the next archive build.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  rehearse:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearse_static }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            config
            data/information-audit/2014
            frontend/build
            frontend/src
            frontend/tests
            scripts
            shared
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm ci
      - name: Rehearse the packing and frozen Pages build
        id: packed
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.STATIC_CLOUDFLARE_ACCOUNT_ID }}
          DATA_BASE: ${{ vars.STATIC_DATA_BASE_URL }}
          STATIC_PAGES_COMPAT_URL: ${{ vars.STATIC_PAGES_COMPAT_URL }}
          STATIC_PAGES_COMPAT_SHA256: ${{ vars.STATIC_PAGES_COMPAT_SHA256 }}
          STATIC_PAGES_COMPAT_INVENTORY_SHA256: ${{ vars.STATIC_PAGES_COMPAT_INVENTORY_SHA256 }}
        run: python scripts/prepare_static_ci.py --pages --output "$RUNNER_TEMP/static-publication" --data-base-url "$DATA_BASE"
      - name: Verify the current Cloudflare deployment
        env:
          DATA_BASE: ${{ vars.STATIC_DATA_BASE_URL }}
          STATIC_REVISION: ${{ steps.packed.outputs.revision }}
          STATIC_CHANGED: ${{ steps.packed.outputs.changed }}
        run: |
          if [ "$STATIC_CHANGED" = false ]; then
            node scripts/verify-static-host.mjs "$DATA_BASE" "$STATIC_REVISION" index.json credit/index.json investors/index.json
          fi
