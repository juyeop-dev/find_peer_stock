name: Build Stock Peer Site

on:
  workflow_dispatch:
    inputs:
      force_fetch:
        description: "Fetch every ticker, ignoring market hours."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate stock data
        shell: bash
        env:
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fetch == true }}
        run: |
          generate_args=(--skip-write-when-no-fetch)
          if [[ "$FORCE_FETCH" == "true" ]]; then
            generate_args=(--force-fetch)
          fi
          python scripts/generate_static_data.py "${generate_args[@]}"

      - name: Commit generated stock data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated frontend/public/data
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Update stock peer data [skip ci]"
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Copy SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
