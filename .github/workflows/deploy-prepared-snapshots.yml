name: Deploy prepared stock snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-prepared-snapshots.yml]

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

jobs:
  build:
    concurrency:
      group: prepared-stock-snapshots-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Release obsolete deployment waits after completed snapshot builds
        uses: actions/github-script@v8
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const current = await github.rest.actions.getWorkflowRun({...repo, run_id: context.runId});
            const runs = await github.rest.actions.listWorkflowRunsForRepo({...repo, per_page: 30});
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId || run.head_branch !== 'main' || run.created_at >= current.data.created_at
                  || !['Build Stock Peer Site', 'Deploy prepared stock snapshots'].includes(run.name)
                  || !['queued', 'pending', 'waiting', 'in_progress'].includes(run.status)) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({...repo, run_id: run.id});
              if (!artifacts.data.artifacts.some(item => item.name === 'github-pages')) continue;
              const pending = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/pending_deployments', {...repo, run_id: run.id});
              if (pending.data.some(item => (item.reviewers ?? []).length > 0 || item.wait_timer > 0)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({...repo, run_id: run.id});
                core.info(`Cancelled obsolete deployment run ${run.id}; its snapshot artifact was already uploaded.`);
              } catch (error) {
                if (error.status !== 409) throw error;
                try {
                  await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {...repo, run_id: run.id});
                  core.info(`Force-cancelled obsolete deployment run ${run.id}.`);
                } catch (retry) {
                  if (retry.status !== 409) throw retry;
                  core.warning(`Run ${run.id} could not be cancelled; retaining the existing snapshot artifact.`);
                }
              }
            }
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate snapshot readers and original provider adapters
        run: |
          python -m unittest discover -s tests
          node --test automation/live-api/test/*.test.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate chart coverage and reported statement retention
        working-directory: frontend
        run: |
          npm run test:stock-history
          npm run test:stock-information
          npm run test:stock-details
      - name: Build from committed stock snapshots
        working-directory: frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Copy SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    concurrency:
      group: pages
      cancel-in-progress: true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
